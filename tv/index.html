const show = (text, ok) => { status.textContent = text; status.className = ok ? "ok" : "err"; };

});

  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ c: code.value.trim().toUpperCase(), u: link.value }) });
    const j = await r.json().catch(() => ({}));
    if (j.ok) { show(t[5], true); link.value = ""; }
