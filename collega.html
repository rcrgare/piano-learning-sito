const TD = {"it": ["Collega la tua cartella di Google Drive alla TV", "In Google Drive apri la cartella con i tuoi brani (MIDI o MusicXML), tocca Condividi → «Chiunque abbia il link» → Copia link, poi incollalo qui.", "Link della cartella", "Inviato! Tra qualche secondo la TV si collega alla cartella.", "Questo non è il link di una cartella di Google Drive: copia il link della cartella e riprova.", "Se scrivi il link con il telecomando, accorcialo prima con tinyurl.com: è molto più facile da digitare."], "en": ["Connect your Google Drive folder to the TV", "In Google Drive open the folder with your pieces (MIDI or MusicXML), tap Share → «Anyone with the link» → Copy link, then paste it here.", "Folder link", "Sent! In a few seconds the TV connects to the folder.", "That isn't a Google Drive folder link: copy the folder's link and try again.", "If you type the link with the remote, shorten it first with tinyurl.com: it is much easier to type."], "es": ["Conecta tu carpeta de Google Drive a la TV", "En Google Drive abre la carpeta con tus piezas (MIDI o MusicXML), toca Compartir → «Cualquier persona con el enlace» → Copiar enlace y pégalo aquí.", "Enlace de la carpeta", "¡Enviado! En unos segundos la TV se conecta a la carpeta.", "Eso no es el enlace de una carpeta de Google Drive: copia el enlace de la carpeta e inténtalo de nuevo.", "Si escribes el enlace con el mando, acórtalo antes con tinyurl.com: es mucho más fácil de escribir."], "fr": ["Connectez votre dossier Google Drive à la TV", "Dans Google Drive, ouvrez le dossier avec vos morceaux (MIDI ou MusicXML), touchez Partager → « Tous les utilisateurs disposant du lien » → Copier le lien, puis collez-le ici.", "Lien du dossier", "Envoyé ! Dans quelques secondes, la TV se connecte au dossier.", "Ce n'est pas le lien d'un dossier Google Drive : copiez le lien du dossier et réessayez.", "Si vous tapez le lien avec la télécommande, raccourcissez-le d'abord avec tinyurl.com : c'est bien plus facile à saisir."], "de": ["Verbinde deinen Google-Drive-Ordner mit dem Fernseher", "Öffne in Google Drive den Ordner mit deinen Stücken (MIDI oder MusicXML), tippe auf Teilen → „Jeder mit dem Link“ → Link kopieren und füge ihn hier ein.", "Link zum Ordner", "Gesendet! In wenigen Sekunden verbindet sich der Fernseher mit dem Ordner.", "Das ist kein Link zu einem Google-Drive-Ordner: Kopiere den Link des Ordners und versuche es erneut.", "Wenn du den Link mit der Fernbedienung eingibst, kürze ihn vorher mit tinyurl.com: So ist er viel leichter einzutippen."], "pt": ["Conecte sua pasta do Google Drive à TV", "No Google Drive abra a pasta com suas peças (MIDI ou MusicXML), toque em Compartilhar → «Qualquer pessoa com o link» → Copiar link e cole aqui.", "Link da pasta", "Enviado! Em alguns segundos a TV se conecta à pasta.", "Isso não é o link de uma pasta do Google Drive: copie o link da pasta e tente de novo.", "Se for digitar o link com o controle remoto, encurte-o antes com tinyurl.com: fica muito mais fácil de digitar."], "ru": ["Подключите свою папку Google Диска к телевизору", "В Google Диске откройте папку со своими пьесами (MIDI или MusicXML), нажмите «Поделиться» → «Все, у кого есть ссылка» → «Копировать ссылку» и вставьте её сюда.", "Ссылка на папку", "Отправлено! Через несколько секунд телевизор подключится к папке.", "Это не ссылка на папку Google Диска: скопируйте ссылку на папку и попробуйте снова.", "Если вводите ссылку с пульта, сначала сократите её на tinyurl.com: так её гораздо проще набрать."], "ja": ["Google ドライブのフォルダをテレビにつなぐ", "Google ドライブで曲（MIDI または MusicXML）の入ったフォルダを開き、［共有］→［リンクを知っている全員］→［リンクをコピー］をタップして、ここに貼り付けてください。", "フォルダのリンク", "送信しました！数秒でテレビがフォルダに接続します。", "Google ドライブのフォルダのリンクではありません。フォルダのリンクをコピーしてもう一度お試しください。", "リモコンでリンクを入力する場合は、先に tinyurl.com で短くすると入力がずっと楽になります。"], "zh": ["把你的 Google 云端硬盘文件夹连接到电视", "在 Google 云端硬盘中打开存放乐曲（MIDI 或 MusicXML）的文件夹，点按“共享”→“知道链接的任何人”→“复制链接”，然后粘贴到这里。", "文件夹链接", "已发送！几秒钟后电视会连接到这个文件夹。", "这不是 Google 云端硬盘文件夹的链接：请复制文件夹的链接后重试。", "如果用遥控器输入链接，可以先用 tinyurl.com 缩短，输入会容易得多。"], "ko": ["Google 드라이브 폴더를 TV에 연결하기", "Google 드라이브에서 곡(MIDI 또는 MusicXML)이 들어 있는 폴더를 열고 공유 → 「링크가 있는 모든 사용자」 → 링크 복사를 누른 뒤 여기에 붙여 넣으세요.", "폴더 링크", "보냈습니다! 몇 초 뒤 TV가 폴더에 연결됩니다.", "Google 드라이브 폴더 링크가 아닙니다. 폴더 링크를 복사해 다시 시도하세요.", "리모컨으로 링크를 입력한다면 먼저 tinyurl.com으로 줄이세요. 입력하기가 훨씬 쉽습니다."], "tr": ["Google Drive klasörünüzü TV'ye bağlayın", "Google Drive'da parçalarınızın (MIDI veya MusicXML) bulunduğu klasörü açın, Paylaş → «Bağlantıya sahip olan herkes» → Bağlantıyı kopyala'ya dokunun ve buraya yapıştırın.", "Klasör bağlantısı", "Gönderildi! Birkaç saniye içinde TV klasöre bağlanır.", "Bu bir Google Drive klasör bağlantısı değil: klasörün bağlantısını kopyalayıp tekrar deneyin.", "Bağlantıyı kumandayla yazacaksanız önce tinyurl.com ile kısaltın: yazması çok daha kolay olur."], "bn": ["আপনার Google Drive ফোল্ডার টিভিতে যুক্ত করুন", "Google Drive-এ আপনার সুরের (MIDI বা MusicXML) ফোল্ডারটি খুলুন, শেয়ার → «লিংক আছে এমন যে কেউ» → লিংক কপি করুন চাপুন, তারপর এখানে পেস্ট করুন।", "ফোল্ডারের লিংক", "পাঠানো হয়েছে! কয়েক সেকেন্ডের মধ্যে টিভি ফোল্ডারে যুক্ত হবে।", "এটি Google Drive ফোল্ডারের লিংক নয়: ফোল্ডারের লিংক কপি করে আবার চেষ্টা করুন।", "রিমোট দিয়ে লিংক লিখলে আগে tinyurl.com দিয়ে ছোট করে নিন: লেখা অনেক সহজ হবে।"], "sw": ["Unganisha folda yako ya Google Drive na TV", "Kwenye Google Drive fungua folda yenye vipande vyako (MIDI au MusicXML), gusa Shiriki → «Mtu yeyote aliye na kiungo» → Nakili kiungo, kisha ukibandike hapa.", "Kiungo cha folda", "Imetumwa! Baada ya sekunde chache TV itaunganika na folda.", "Hiki si kiungo cha folda ya Google Drive: nakili kiungo cha folda ujaribu tena.", "Ukiandika kiungo kwa rimoti, kifupishe kwanza kwa tinyurl.com: ni rahisi zaidi kuandika."], "ur": ["اپنا Google Drive فولڈر ٹی وی سے جوڑیں", "Google Drive میں اپنی دھنوں (MIDI یا MusicXML) والا فولڈر کھولیں، شیئر → «لنک والا کوئی بھی» → لنک کاپی کریں پر ٹیپ کریں، پھر یہاں پیسٹ کریں۔", "فولڈر کا لنک", "بھیج دیا! چند سیکنڈ میں ٹی وی فولڈر سے جڑ جائے گا۔", "یہ Google Drive فولڈر کا لنک نہیں ہے: فولڈر کا لنک کاپی کر کے دوبارہ کوشش کریں۔", "اگر لنک ریموٹ سے لکھنا ہو تو پہلے tinyurl.com سے مختصر کر لیں: لکھنا بہت آسان ہو جائے گا۔"], "hi": ["अपना Google Drive फ़ोल्डर टीवी से जोड़ें", "Google Drive में अपनी धुनों (MIDI या MusicXML) वाला फ़ोल्डर खोलें, शेयर → «लिंक वाला कोई भी» → लिंक कॉपी करें दबाएँ, फिर यहाँ पेस्ट करें।", "फ़ोल्डर का लिंक", "भेज दिया! कुछ सेकंड में टीवी फ़ोल्डर से जुड़ जाएगा।", "यह Google Drive फ़ोल्डर का लिंक नहीं है: फ़ोल्डर का लिंक कॉपी करके फिर कोशिश करें।", "अगर लिंक रिमोट से लिखना है तो पहले tinyurl.com से छोटा कर लें: लिखना बहुत आसान होगा।"], "id": ["Hubungkan folder Google Drive Anda ke TV", "Di Google Drive buka folder berisi lagu Anda (MIDI atau MusicXML), ketuk Bagikan → «Siapa saja yang memiliki link» → Salin link, lalu tempel di sini.", "Link folder", "Terkirim! Dalam beberapa detik TV terhubung ke folder.", "Itu bukan link folder Google Drive: salin link folder lalu coba lagi.", "Jika mengetik link dengan remote, pendekkan dulu dengan tinyurl.com: jauh lebih mudah diketik."], "vi": ["Kết nối thư mục Google Drive của bạn với TV", "Trong Google Drive, mở thư mục chứa bản nhạc (MIDI hoặc MusicXML), chạm Chia sẻ → «Bất kỳ ai có đường liên kết» → Sao chép đường liên kết, rồi dán vào đây.", "Liên kết thư mục", "Đã gửi! Vài giây nữa TV sẽ kết nối với thư mục.", "Đây không phải liên kết thư mục Google Drive: hãy sao chép liên kết thư mục và thử lại.", "Nếu nhập liên kết bằng điều khiển, hãy rút gọn trước bằng tinyurl.com: gõ sẽ dễ hơn nhiều."], "ar": ["اربط مجلدك على Google Drive بالتلفزيون", "في Google Drive افتح المجلد الذي فيه مقطوعاتك (MIDI أو MusicXML)، واضغط مشاركة ← «أي شخص لديه الرابط» ← نسخ الرابط، ثم الصقه هنا.", "رابط المجلد", "تم الإرسال! سيتصل التلفزيون بالمجلد خلال ثوانٍ.", "هذا ليس رابط مجلد على Google Drive: انسخ رابط المجلد وحاول مرة أخرى.", "إذا كتبت الرابط بجهاز التحكم، فاختصره أولاً عبر tinyurl.com: تصبح كتابته أسهل بكثير."], "th": ["เชื่อมต่อโฟลเดอร์ Google Drive ของคุณกับทีวี", "ใน Google Drive เปิดโฟลเดอร์ที่มีเพลงของคุณ (MIDI หรือ MusicXML) แตะ แชร์ → «ทุกคนที่มีลิงก์» → คัดลอกลิงก์ แล้ววางที่นี่", "ลิงก์โฟลเดอร์", "ส่งแล้ว! อีกไม่กี่วินาทีทีวีจะเชื่อมต่อกับโฟลเดอร์", "นี่ไม่ใช่ลิงก์โฟลเดอร์ Google Drive: คัดลอกลิงก์ของโฟลเดอร์แล้วลองอีกครั้ง", "ถ้าพิมพ์ลิงก์ด้วยรีโมต ให้ย่อด้วย tinyurl.com ก่อน จะพิมพ์ง่ายขึ้นมาก"], "fil": ["Ikonekta ang iyong folder sa Google Drive sa TV", "Sa Google Drive, buksan ang folder ng iyong mga piyesa (MIDI o MusicXML), i-tap ang Ibahagi → «Sinumang may link» → Kopyahin ang link, saka i-paste dito.", "Link ng folder", "Naipadala! Sa loob ng ilang segundo, kokonekta ang TV sa folder.", "Hindi ito link ng folder sa Google Drive: kopyahin ang link ng folder at subukang muli.", "Kung ita-type mo ang link gamit ang remote, paikliin muna ito sa tinyurl.com: mas madali itong i-type."]};
const RTL = ["ar", "ur"];
